services:
  postgres:
    image: postgres:15-alpine
    container_name: cusca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cusca
      POSTGRES_PASSWORD: cusca123
      POSTGRES_DB: cusca_main
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cusca -d cusca_main"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
