version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cusca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cusca
      POSTGRES_PASSWORD: cusca123
      POSTGRES_DB: cusca_main
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d
    networks:
      - cusca-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cusca -d cusca_main"]
      interval: 10s
      timeout: 5s
      retries: 5

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    image: cusca-config-server:local
    container_name: cusca-config-server
    restart: on-failure
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/app/config-repo:ro
    environment:
      - SPRING_PROFILES_ACTIVE=native
    networks:
      - cusca-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  discovery-server:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    image: cusca-discovery-server:local
    container_name: cusca-discovery-server
    restart: on-failure
    ports:
      - "8761:8761"
    environment:
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    networks:
      - cusca-network
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8761/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: cusca-api-gateway:local
    container_name: cusca-api-gateway
    restart: on-failure
    ports:
      - "8080:8080"
    networks:
      - cusca-network
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    image: cusca-auth-service:local
    container_name: cusca-auth-service
    restart: on-failure
    ports:
      - "8081:8081"
    volumes:
      - auth-service-config:/app/config
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/cusca_main?currentSchema=auth
      - SPRING_DATASOURCE_USERNAME=cusca
      - SPRING_DATASOURCE_PASSWORD=cusca123
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    networks:
      - cusca-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    image: cusca-product-service:local
    container_name: cusca-product-service
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-service:8081/.well-known/jwks.json
    networks:
      - cusca-network
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

volumes:
  postgres_data:
  auth-service-config:

networks:
  cusca-network:
    driver: bridge
