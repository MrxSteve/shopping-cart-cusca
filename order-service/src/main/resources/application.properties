spring.application.name=order-service
spring.config.import=optional:configserver:http://config-server:8888
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/cusca_main?currentSchema=orders
spring.datasource.username=cusca
spring.datasource.password=cusca123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=orders

spring.flyway.enabled=true
spring.flyway.schemas=orders
spring.flyway.default-schema=orders
spring.flyway.baseline-on-migrate=true

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
