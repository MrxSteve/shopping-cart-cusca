spring.application.name=api-gateway
server.port=8080

# Eureka discovery (ervice name inside Docker network)
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# JWT resource server (placeholder — auth-service hostname in docker network)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://auth-service:8081/.well-known/jwks.json

# Attempt to import config server (optional) — fallback to local properties if not available
spring.config.import=optional:configserver:http://config-server:8888
