spring:
  application:
    name: shared-defaults
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
